<style>

<body style="background-color:#0d1017;color:#f0f4f8;">
<header>
<div class="brand-row">
<div class="brand-title">
<div class="hive-hex">H</div>
<h1>NectarSeeker</h1>
</div>
<div id="headerKcStatus"></div>
</div>
<p class="subtitle">Find content relevant to you based on what you like!</p>
</header>

<div id="mainControls">
<div class="panel">
<div class="toolbar-row">
<div class="segmented" id="modeGroup">
<button type="button" class="seg-btn active" data-mode="feed" onclick="setMode('feed')">Feed</button>
<button type="button" class="seg-btn" data-mode="user" onclick="setMode('user')">Username</button>
<button type="button" class="seg-btn" data-mode="search" onclick="setMode('search')">Search</button>
<button type="button" class="seg-btn" data-mode="newusers" onclick="setMode('newusers')">New Users</button>
</div>

<button type="button" class="seg-btn active" data-sort="relevant" onclick="setSort('relevant')">Relevant</button>

<input type="text" id="queryInput" placeholder="Enter your Hive username" autocapitalize="none" autocorrect="off" />

</div>

</div>
</div>

<div id="status">Ready. Enter your Hive username or connect Keychain.</div>
<div id="postReader"></div>
<div id="feed"></div>
<script>
var HIVE_NODES = ['https://hive.blog', 'https://deathwing.me', 'https://openhive.network', 'https://techcoderx.com'];
var STOP_WORDS = { the:1,and:1,for:1,that:1,this:1,with:1,you:1,are:1,was:1,were:1,from:1,have:1,has:1,had:1,not:1,but:1,what:1,all:1,when:1,can:1,said:1,there:1,use:1,each:1,which:1,their:1,time:1,will:1,way:1,about:1,many:1,then:1,them:1,would:1,write:1,like:1,these:1,long:1,make:1,thing:1,see:1,him:1,two:1,more:1,could:1,come:1,did:1,my:1,sound:1,most:1,people:1,over:1,know:1,water:1,than:1,call:1,first:1,who:1,may:1,down:1,side:1,been:1,now:1,find:1,any:1,new:1,work:1,part:1,take:1,get:1,place:1,made:1,live:1,where:1,after:1,back:1,little:1,only:1,round:1,man:1,year:1,came:1,show:1,every:1,good:1,give:1,our:1,under:1,very:1,just:1,form:1,much:1,great:1,think:1,say:1,help:1,low:1,line:1,before:1,turn:1,cause:1,same:1,mean:1,differ:1,move:1,right:1,boy:1,old:1,too:1,does:1,tell:1,sentence:1,set:1,three:1,want:1,air:1,well:1,also:1,play:1,small:1,end:1,put:1,home:1,read:1,hand:1,port:1,large:1,spell:1,add:1,even:1,land:1,here:1,must:1,big:1,high:1,such:1,follow:1,act:1,why:1,ask:1,men:1,change:1,went:1,light:1,kind:1,off:1,need:1,house:1,picture:1,try:1,again:1,animal:1,point:1,mother:1,world:1,near:1,build:1,self:1,earth:1,father:1,http:1,https:1,www:1,com:1,org:1,net:1,hive:1,peakd:1,ecency:1,post:1,blog:1,images:1,png:1,jpg:1,jpeg:1,webp:1,gif:1 };
var appState = { mode: 'feed', sort: 'relevant', results: [], isRunning: false, kcUser: '', savedScrollY: 0, userVoteHistoryMap: {} };
var TASTE_KEY = 'nectarseeker_taste_v1';
var KC_USER_KEY = 'nectarseeker_kc_user';

function stripLeadingAt(str) {
var s = String(str || '').trim().toLowerCase();
while (s.length > 0 && s.charAt(0) === '@') s = s.slice(1);
return s;
}

function escapeHtml(str) {
return String(str || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
}

function getConnectedUser() {
if (appState.kcUser) return appState.kcUser;
try {
var stored = localStorage.getItem(KC_USER_KEY) || '';
if (stored) { appState.kcUser = stripLeadingAt(stored); return appState.kcUser; }
} catch (e) {}
return '';
}

function updateKeychainUI() {
var user = getConnectedUser();
var hs = document.getElementById('headerKcStatus');
var btn = document.getElementById('keychainBtn');
var hint = document.getElementById('kcHint');
var disc = document.getElementById('kcConnectedActions');
var row = document.getElementById('kcRow');
if (user) {
if (row) row.style.display = 'flex';
if (hs) hs.innerHTML = '<span class="kc-badge">🔑 @' + escapeHtml(user) + '</span>';
if (btn) btn.textContent = 'Switch Account';
if (hint) hint.textContent = 'Showing votes for @' + user;
if (disc) disc.style.display = 'block';
} else {
if (hs) hs.innerHTML = '';
if (btn) btn.textContent = 'Connect Hive Keychain';
if (hint) hint.textContent = 'Choose an account to see vote status';
if (disc) disc.style.display = 'none';
}
}

function disconnectKeychain() {
appState.kcUser = '';
appState.userVoteHistoryMap = {};
try { localStorage.removeItem(KC_USER_KEY); } catch (e) {}
updateKeychainUI();
if (appState.results.length > 0) renderCards(appState.results.slice(0, 100));
setStatus('Disconnected Hive Keychain.', false);
}

function getUserVoteInfo(post, username) {
if (!username || !post) return null;
var target = stripLeadingAt(username);
var key = post.author + '/' + post.permlink;
if (Array.isArray(post.active_votes)) {
for (var i = 0; i < post.active_votes.length; i++) {
var v = post.active_votes[i];
if (v && stripLeadingAt(v.voter) === target) {
var rw = typeof v.percent === 'number' ? v.percent : (typeof v.weight === 'number' ? v.weight : 0);
if (!rw && v.rshares !== undefined) {
var rs = Number(v.rshares);
if (rs > 0) return { voted: true, percent: null };
if (rs < 0) return { voted: true, percent: -1 };
}
if (rw === 0) return { voted: false, percent: 0 };
return { voted: true, percent: Math.round(rw / 100) };
}
}
}
if (appState.userVoteHistoryMap && Object.prototype.hasOwnProperty.call(appState.userVoteHistoryMap, key)) {
var hw = appState.userVoteHistoryMap[key];
return hw === 0 ? { voted: false, percent: 0 } : { voted: true, percent: Math.round(hw / 100) };
}
return { voted: false, percent: 0 };
}
function syncUserVotesForDisplayedPosts(username) {
if (!username || !appState.results || appState.results.length === 0) return Promise.resolve();
var target = stripLeadingAt(username);
var slice = appState.results.slice(0, 100);
var missing = [];
for (var i = 0; i < slice.length; i++) {
var p = slice[i].post;
var found = false;
if (Array.isArray(p.active_votes)) {
for (var j = 0; j < p.active_votes.length; j++) {
if (p.active_votes[j] && stripLeadingAt(p.active_votes[j].voter) === target) { found = true; break; }
}
}
if (!found) missing.push(p);
}
if (missing.length === 0) { renderCards(slice); return Promise.resolve(); }
var idx = 0, batchSize = 15;
function nextBatch() {
if (idx >= missing.length) return Promise.resolve();
var batch = missing.slice(idx, idx + batchSize);
idx += batchSize;
return Promise.all(batch.map(function (post) {
return hiveCall('condenser_api.get_active_votes', [post.author, post.permlink]).then(function (votes) {
if (Array.isArray(votes)) {
post.active_votes = votes;
for (var k = 0; k < votes.length; k++) {
if (votes[k] && stripLeadingAt(votes[k].voter) === target) {
appState.userVoteHistoryMap[post.author + '/' + post.permlink] = typeof votes[k].percent === 'number' ? votes[k].percent : (votes[k].weight || 0);
}
}
}
}).catch(function () {});
})).then(nextBatch);
}
return nextBatch().then(function () { renderCards(appState.results.slice(0, 100)); });
}

function analyzeAI(text) {
if (!text || text.length < 60) return { score: 10, label: 'AI Prob: 10%', className: 'ai-badge' };
var aiWords = ['delve','tapestry','beacon','testament','paramount','meticulously','furthermore','conclusion','noteworthy','realm','nexus','revolutionize','multifaceted','leverage','robust','seamlessly','holistic','embark','paradigm','synergy','crucial','vital','in summary'];
var lower = text.toLowerCase(), words = lower.split(/\s+/), wc = words.length;
if (!wc) return { score: 10, label: 'AI Prob: 10%', className: 'ai-badge' };
var mc = 0;
for (var i = 0; i < aiWords.length; i++) {
var m = lower.match(new RegExp('\b' + aiWords[i] + '\b', 'g'));
if (m) mc += m.length;
}
var score = Math.min(90, Math.max(10, Math.round(((mc / wc) * 100) * 55)));
var cls = score >= 75 ? 'ai-badge danger' : (score >= 50 ? 'ai-badge warning' : 'ai-badge');
return { score: score, label: (score >= 50 ? '⚠️ ' : '') + 'AI Prob: ' + score + '%', className: cls };
}

function loadTaste() {
try {
var p = JSON.parse(localStorage.getItem(TASTE_KEY) || '{}');
return { weights: p.weights || {}, liked: p.liked || {}, disliked: p.disliked || {} };
} catch (e) { return { weights: {}, liked: {}, disliked: {} }; }
}

function saveTaste(t) {
try { localStorage.setItem(TASTE_KEY, JSON.stringify(t)); } catch (e) {}
updateTasteBanner();
}

function resetTaste() {
try { localStorage.removeItem(TASTE_KEY); } catch (e) {}
updateTasteBanner();
if (appState.results.length > 0) rerankAndRender();
setStatus('Learned preferences cleared.', false);
}

function updateTasteBanner() {
var t = loadTaste(), el = document.getElementById('tasteSummary');
if (!el) return;
var lc = Object.keys(t.liked).length, dc = Object.keys(t.disliked).length;
if (!lc && !dc) { el.innerHTML = 'Use <strong>More</strong> or <strong>Less</strong> on cards to train your feed.'; return; }
el.innerHTML = 'Trained on <strong>' + lc + '</strong> liked & <strong>' + dc + '</strong> hidden';
}

function setStatus(msg, isError) {
var el = document.getElementById('status');
if (!el) return;
el.textContent = msg;
el.className = isError ? 'error' : '';
}

function cleanMarkdown(text) {
return String(text || '').replace(/<[^>]*>/g, ' ').replace(/https?://\S+/g, ' ').replace(/[^a-zA-Z0-9]+/g, ' ').trim();
}

function tokenize(text) {
var parts = cleanMarkdown(text).toLowerCase().split(' '), out = [];
for (var i = 0; i < parts.length; i++) {
var w = parts[i];
if (w.length >= 3 && !STOP_WORDS[w] && isNaN(Number(w))) out.push(w);
}
return out;
}

function buildVector(tokens, weightsMap) {
var counts = {}, vec = {}, normSq = 0;
for (var i = 0; i < tokens.length; i++) {
var t = tokens[i];
counts[t] = (counts[t] || 0) + (weightsMap ? (weightsMap[t] || 1) : 1);
}
for (var k in counts) {
if (counts[k] > 0) {
var tf = 1 + Math.log(counts[k]);
vec[k] = tf;
normSq += tf * tf;
}
}
return { vec: vec, norm: Math.sqrt(normSq) };
}

function cosineSim(a, b) {
if (!a.norm || !b.norm) return { score: 0, matched: [] };
var dot = 0, matched = [];
for (var k in a.vec) {
if (b.vec[k]) {
var p = a.vec[k] * b.vec[k];
dot += p;
matched.push({ term: k, w: p });
}
}
matched.sort(function (x, y) { return y.w - x.w; });
return { score: dot / (a.norm * b.norm), matched: matched.slice(0, 5).map(function (x) { return x.term; }) };
}

function hiveCall(method, params) {
var idx = 0, lastErr = 'Error';
function next() {
if (idx >= HIVE_NODES.length) return Promise.reject(new Error('Nodes failed: ' + lastErr));
var node = HIVE_NODES[idx++];
return fetch(node, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ jsonrpc: '2.0', method: method, params: params, id: 1 })
}).then(function (r) {
if (!r.ok) throw new Error('HTTP ' + r.status);
return r.json();
}).then(function (d) {
if (d && d.error) throw new Error(d.error.message);
return d.result;
}).catch(function (e) { lastErr = e.message; return next(); });
}
return next();
}
function setMode(m) {
appState.mode = m;
var btns = document.querySelectorAll('#modeGroup .seg-btn');
for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-mode') === m);
var input = document.getElementById('queryInput');
if (input) {
if (m === 'user') input.placeholder = 'Enter Hive username (e.g. hive3)';
else if (m === 'feed') input.placeholder = 'Enter your Hive username for personal feed';
else if (m === 'search') input.placeholder = 'Enter search keywords (e.g. painting)';
else if (m === 'newusers') input.placeholder = 'Optional keyword or leave blank';
}
}

function setSort(s) {
appState.sort = s;
var btns = document.querySelectorAll('#sortGroup .seg-btn');
for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-sort') === s);
if (appState.results.length > 0) rerankAndRender();
}

function resolveQueryMode(rawInput) {
var trimmed = String(rawInput || '').trim(), cachedKc = getConnectedUser();
if (appState.mode === 'feed') {
var u = stripLeadingAt(trimmed) || cachedKc;
return u ? Promise.resolve({ type: 'feed', value: u }) : Promise.reject(new Error('Enter username or connect Keychain.'));
}
if (appState.mode === 'user') {
var u = stripLeadingAt(trimmed) || cachedKc;
return u ? Promise.resolve({ type: 'user', value: u }) : Promise.reject(new Error('Please enter a Hive username.'));
}
if (appState.mode === 'search') {
return trimmed ? Promise.resolve({ type: 'search', value: trimmed }) : Promise.reject(new Error('Please enter search keywords.'));
}
return Promise.resolve({ type: 'newusers', value: trimmed });
}

function getAccountHistory(username, months) {
var cutoff = Date.now() - (months * 30.5 * 86400000), skipKeys = {}, weightedSeeds = {}, page = 0, maxPages = months > 6 ? 80 : 25, startSeq = -1;
function fetchPage() {
page++;
var limit = (page === 1 && startSeq === -1) ? 20 : 1000;
return hiveCall('condenser_api.get_account_history', [username, startSeq, limit, 3])
.catch(function () { return hiveCall('condenser_api.get_account_history', [username, startSeq, limit]); })
.catch(function () { return []; })
.then(function (entries) {
if (!Array.isArray(entries) || entries.length === 0) return finalize();
var lowestSeq = null, reachedCutoff = false;
for (var i = entries.length - 1; i >= 0; i--) {
var item = entries[i];
if (!Array.isArray(item) || item.length < 2) continue;
var seq = item[0], tx = item[1];
if (lowestSeq === null || seq < lowestSeq) lowestSeq = seq;
if (tx && tx.timestamp) {
var ts = Date.parse(tx.timestamp + 'Z');
if (!isNaN(ts) && ts < cutoff) { reachedCutoff = true; continue; }
}
var op = tx && tx.op;
if (!op) continue;
var opType = Array.isArray(op) ? op[0] : op.type, opData = Array.isArray(op) ? op[1] : op.value;
if (!opData) continue;
if (opType === 'vote' || opType === 'vote_operation') {
if (opData.voter === username && opData.author && opData.permlink) {
var vKey = opData.author + '/' + opData.permlink;
skipKeys[vKey] = true;
appState.userVoteHistoryMap[vKey] = opData.weight;
if (opData.weight > 0 && opData.author !== username) {
if (!weightedSeeds[vKey]) weightedSeeds[vKey] = { author: opData.author, permlink: opData.permlink, weight: 1.0 };
weightedSeeds[vKey].weight += 1.0;
}
}
} else if (opType === 'comment' || opType === 'comment_operation') {
if (opData.author === username) {
if (opData.permlink) skipKeys[username + '/' + opData.permlink] = true;
if (!opData.parent_author) {
var sKey = username + '/' + opData.permlink;
if (!weightedSeeds[sKey]) weightedSeeds[sKey] = { author: username, permlink: opData.permlink, weight: 2.0 };
} else if (opData.parent_author !== username) {
var cKey = opData.parent_author + '/' + opData.parent_permlink;
skipKeys[cKey] = true;
if (!weightedSeeds[cKey]) weightedSeeds[cKey] = { author: opData.parent_author, permlink: opData.parent_permlink, weight: 1.5 };
}
}
}
}
if (reachedCutoff || lowestSeq === null || lowestSeq <= 0 || page >= maxPages) return finalize();
startSeq = lowestSeq - 1;
return fetchPage();
});
}
function finalize() {
var list = [];
for (var k in weightedSeeds) if (Object.prototype.hasOwnProperty.call(weightedSeeds, k)) list.push(weightedSeeds[k]);
list.sort(function (a, b) { return b.weight - a.weight; });
return { seeds: list.slice(0, months > 6 ? 120 : 60), skipKeys: skipKeys };
}
return fetchPage();
}
function fetchSeedPosts(seeds, skipKeys) {
var results = [], idx = 0, batchSize = 12;
function nextBatch() {
if (idx >= seeds.length) return Promise.resolve(results);
var slice = seeds.slice(idx, idx + batchSize);
idx += batchSize;
return Promise.all(slice.map(function (item) {
return hiveCall('bridge.get_post', { author: item.author, permlink: item.permlink })
.catch(function () { return hiveCall('condenser_api.get_content', [item.author, item.permlink]); })
.then(function (post) {
if (post && post.root_author && post.root_permlink) skipKeys[post.root_author + '/' + post.root_permlink] = true;
return { post: post, weight: item.weight };
}).catch(function () { return null; });
})).then(function (batchRes) {
for (var i = 0; i < batchRes.length; i++) if (batchRes[i] && batchRes[i].post) results.push(batchRes[i]);
return nextBatch();
});
}
return nextBatch();
}

function fetchPaginatedRanked(sort, pages, observer) {
var collected = [], startAuthor = '', startPermlink = '', step = 0;
function nextPage() {
if (step >= pages) return Promise.resolve(collected);
step++;
var params = { sort: sort, tag: '', limit: 20 };
if (observer) params.observer = observer;
if (startAuthor && startPermlink) { params.start_author = startAuthor; params.start_permlink = startPermlink; }
return hiveCall('bridge.get_ranked_posts', params).then(function (posts) {
if (!Array.isArray(posts) || posts.length === 0) return collected;
for (var i = 0; i < posts.length; i++) collected.push(posts[i]);
var last = posts[posts.length - 1];
if (!last || !last.author || !last.permlink || posts.length < 20) return collected;
startAuthor = last.author; startPermlink = last.permlink;
return nextPage();
}).catch(function () { return collected; });
}
return nextPage();
}

function fetchAllFrontendsPool(observer) {
var obs = observer || getConnectedUser();
return Promise.all([
hiveCall('condenser_api.get_discussions_by_created', [{ tag: '', limit: 20 }]).catch(function () { return []; }),
hiveCall('condenser_api.get_discussions_by_trending', [{ tag: '', limit: 20 }]).catch(function () { return []; }),
fetchPaginatedRanked('created', 5, obs),
fetchPaginatedRanked('trending', 4, obs),
fetchPaginatedRanked('hot', 3, obs)
]).then(function (groups) {
var map = {}, list = [];
for (var g = 0; g < groups.length; g++) {
var arr = groups[g] || [];
for (var i = 0; i < arr.length; i++) {
var p = arr[i];
if (!p || !p.author || !p.permlink || p.parent_author) continue;
var key = p.author + '/' + p.permlink;
if (!map[key]) { map[key] = true; list.push(p); }
}
}
return list;
});
}

function detectFrontend(post) {
var meta = post.json_metadata;
if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch (e) { meta = {}; } }
var app = (meta && meta.app) ? String(meta.app).toLowerCase() : '';
if (app.indexOf('peakd') !== -1) return 'PeakD';
if (app.indexOf('ecency') !== -1) return 'Ecency';
if (app.indexOf('leofinance') !== -1 || app.indexOf('inleo') !== -1) return 'InLeo';
if (app.indexOf('liketu') !== -1) return 'Liketu';
if (app.indexOf('3speak') !== -1) return '3Speak';
return 'Hive dApp';
}

function formatAge(createdStr) {
if (!createdStr) return '';
var ts = Date.parse(createdStr + 'Z');
if (isNaN(ts)) return '';
var diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
if (diffSec < 3600) return Math.max(1, Math.floor(diffSec / 60)) + 'm ago';
if (diffSec < 86400) return Math.floor(diffSec / 3600) + 'h ago';
var days = Math.floor(diffSec / 86400);
return days < 30 ? days + 'd ago' : new Date(ts).toLocaleDateString();
}

function formatPostBodyHtml(rawBody) {
var text = String(rawBody || '').replace(/<(script|style|iframe|object|embed|form)[^>]>[\s(\S)]?</\1>/gi, '');
text = text.replace(/![([^]])]((https?://[^\s)]+))/gi, function (, alt, url) {
return '\n<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(alt) + '" loading="lazy" />\n';
});
text = text.replace(/[([^]]+)]((https?://[^\s)]+))/gi, function (, label, url) {
return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
});
var blocks = text.split(/\n{2,}/), out = [];
for (var i = 0; i < blocks.length; i++) {
var b = blocks[i].trim();
if (!b) continue;
if (/^<img\s/i.test(b) || /^<(div|p|blockquote|ul|ol|table|h[1-6]|pre|hr)/i.test(b)) { out.push(b); continue; }
if (/^#{1,4}\s+/.test(b)) {
var lvl = b.match(/^(#{1,4})/).length;
out.push('<h' + lvl + '>' + b.replace(/^#{1,4}\s+/, '') + '</h' + lvl + '>');
continue;
}
if (/^>\s?/.test(b)) { out.push('<blockquote>' + b.replace(/^>\s?/gm, '').replace(/\n/g, '<br>') + '</blockquote>'); continue; }
var fmt = b.replace(/**([^*]+)**/g, '<strong>$1&lt;/strong&gt;').replace(/\*([^*]+)\*/g, '&lt;em&gt;\$1</em>')
.replace(/(^|[\s>])(https?://[^\s<"]+.(?:png|jpg|jpeg|gif|webp)(?:?[^\s<"])?)/gi, '$1&lt;img src="\$2" loading="lazy" />')
.replace(/\n/g, '<br>');
out.push('<p>' + fmt + '</p>');
}
return out.join('\n');
}

function openPostInPage(idx) {
var item = appState.results[idx];
if (!item || !item.post) return;
var post = item.post;
appState.savedScrollY = window.scrollY || window.pageYOffset || 0;
document.getElementById('mainControls').style.display = 'none';
document.getElementById('feed').style.display = 'none';
document.getElementById('status').style.display = 'none';
renderReaderContent(post, true);
var readerEl = document.getElementById('postReader');
readerEl.style.display = 'block';
window.scrollTo(0, 0);
var obs = getConnectedUser();
hiveCall('bridge.get_post', { author: post.author, permlink: post.permlink, observer: obs || '' })
.catch(function () { return hiveCall('condenser_api.get_content', [post.author, post.permlink]); })
.then(function (full) { if (full && full.author) { item.post = full; if (readerEl.style.display === 'block') renderReaderContent(full, false); } })
.catch(function () { if (readerEl.style.display === 'block') renderReaderContent(post, false); });
}

function renderReaderContent(post, isLoading) {
var readerEl = document.getElementById('postReader'), dapp = detectFrontend(post), age = formatAge(post.created), cu = getConnectedUser();
var aEnc = encodeURIComponent(post.author), pEnc = encodeURIComponent(post.permlink);
var voteBadge = '';
if (cu) {
var vi = getUserVoteInfo(post, cu);
if (vi && vi.voted) {
voteBadge = (vi.percent === null || vi.percent > 0)
? '<span class="vote-status-badge voted">✓ Voted' + (vi.percent ? ' (' + vi.percent + '%)' : '') + '</span>'
: '<span class="vote-status-badge downvoted">▼ Downvoted (' + vi.percent + '%)</span>';
} else voteBadge = '<span class="vote-status-badge unvoted">Not Voted</span>';
}
readerEl.innerHTML = '<div class="reader-topbar"><button type="button" class="back-btn" onclick="closePostReader()">← Back to Results</button><div class="badge-group">' + voteBadge + '<span class="dapp-tag">' + escapeHtml(dapp) + '</span></div></div>' +
'<h2 class="reader-title">' + escapeHtml(post.title || '(Untitled)') + '</h2>' +
'<div class="reader-meta"><span>Author: <strong>@' + escapeHtml(post.author) + '</strong></span>' + (age ? '<span>· ' + escapeHtml(age) + '</span>' : '') + (isLoading ? '<span style="color:#38bdf8;">· Loading full post...</span>' : '') + '</div>' +
'<div class="reader-body">' + formatPostBodyHtml(post.body || '') + '</div>' +
'<div class="reader-footer"><button type="button" class="back-btn" onclick="closePostReader()">← Back to Results</button><span class="fe-links">External: <a href="https://peakd.com@' + aEnc + '/' + pEnc + '" target="_blank" rel="noopener noreferrer">PeakD</a> | <a href="https://ecency.com@' + aEnc + '/' + pEnc + '" target="_blank" rel="noopener noreferrer">Ecency</a> | <a href="https://hive.blog@' + aEnc + '/' + pEnc + '" target="_blank" rel="noopener noreferrer">Hive.blog</a></span></div>';
}

function closePostReader() {
var readerEl = document.getElementById('postReader');
readerEl.style.display = 'none'; readerEl.innerHTML = '';
document.getElementById('mainControls').style.display = 'block';
document.getElementById('feed').style.display = 'block';
document.getElementById('status').style.display = 'block';
if (appState.results.length > 0) renderCards(appState.results.slice(0, 100));
window.scrollTo(0, appState.savedScrollY || 0);
}
function learnFromCard(idx, delta) {
var item = appState.results[idx];
if (!item) return;
var taste = loadTaste(), key = item.post.author + '/' + item.post.permlink;
tokenize(item.post.title || '').forEach(function (t) { taste.weights[t] = (taste.weights[t] || 0) + (delta * 1.4); });
tokenize((item.post.body || '').slice(0, 1200)).forEach(function (t) { taste.weights[t] = (taste.weights[t] || 0) + (delta * 0.6); });
if (delta > 0) { taste.liked[key] = true; delete taste.disliked[key]; }
else { taste.disliked[key] = true; delete taste.liked[key]; }
saveTaste(taste);
rerankAndRender();
}

function rerankAndRender() {
var taste = loadTaste(), active = [];
for (var i = 0; i < appState.results.length; i++) {
var item = appState.results[i], key = item.post.author + '/' + item.post.permlink;
if (taste.disliked[key]) continue;
var boost = 0, seen = {};
for (var j = 0; j < item.tokens.length; j++) {
var t = item.tokens[j];
if (!seen[t] && taste.weights[t]) { seen[t] = true; boost += taste.weights[t] * 0.03; }
}
item.finalScore = Math.max(0, item.baseScore + boost);
item.isLiked = !!taste.liked[key];
active.push(item);
}
if (appState.sort === 'newest') active.sort(function (a, b) { return b.timestamp - a.timestamp; });
else if (appState.sort === 'oldest') active.sort(function (a, b) { return a.timestamp - b.timestamp; });
else active.sort(function (a, b) { return b.finalScore - a.finalScore; });
appState.results = active;
renderCards(active.slice(0, 100));
}
function renderCards(items) {
var feedEl = document.getElementById('feed');
if (!items.length) { feedEl.innerHTML = ''; setStatus('No posts found.', false); return; }
var cu = getConnectedUser(), html = '';
for (var i = 0; i < items.length; i++) {
var item = items[i], p = item.post, dapp = detectFrontend(p);
var aEnc = encodeURIComponent(p.author), pEnc = encodeURIComponent(p.permlink);
var rawBody = cleanMarkdown(p.body || ''), snippet = rawBody.length > 200 ? rawBody.slice(0, 200) + '...' : rawBody;
var pct = Math.min(99, Math.max(1, Math.round(item.finalScore * 100))), age = formatAge(p.created);
var ai = analyzeAI((p.title || '') + ' ' + (p.body || '')), vBadge = '';
if (cu) {
var vi = getUserVoteInfo(p, cu);
if (vi && vi.voted) {
vBadge = (vi.percent === null || vi.percent > 0)
? '<span class="vote-status-badge voted">✓ Voted' + (vi.percent ? ' (' + vi.percent + '%)' : '') + '</span>'
: '<span class="vote-status-badge downvoted">▼ Downvoted (' + vi.percent + '%)</span>';
} else vBadge = '<span class="vote-status-badge unvoted">Not Voted</span>';
}
html += '<div class="card' + (item.isLiked ? ' liked' : '') + '"><div class="card-top"><h3><span class="rank-num">' + (i + 1) + '.</span><a href="#post-' + i + '" onclick="openPostInPage(' + i + ');return false;">' + escapeHtml(p.title || '(Untitled)') + '</a></h3><div class="badge-group">' + vBadge + '<span class="' + ai.className + '">' + escapeHtml(ai.label) + '</span><span class="dapp-tag">' + escapeHtml(dapp) + '</span></div></div>' +
'<div class="meta">by <strong>@' + escapeHtml(p.author) + '</strong>' + (age ? ' · ' + escapeHtml(age) : '') + ' · Relevance: <strong>' + pct + '%</strong></div>' +
'<div class="snippet">' + escapeHtml(snippet) + '</div>' +
'<div class="card-footer">' + (item.matched && item.matched.length ? '<div class="keywords">Matches: ' + escapeHtml(item.matched.join(', ')) + '</div>' : '<div></div>') +
'<div class="actions-right"><button type="button" class="vote-btn read" onclick="openPostInPage(' + i + ')">Read</button><span class="fe-links"><a href="https://peakd.com@' + aEnc + '/' + pEnc + '" target="_blank">PeakD</a> | <a href="https://ecency.com@' + aEnc + '/' + pEnc + '" target="_blank">Ecency</a></span><button type="button" class="vote-btn up" onclick="learnFromCard(' + i + ',1)">👍 More</button><button type="button" class="vote-btn down" onclick="learnFromCard(' + i + ',-1)">👎 Less</button></div></div></div>';
}
feedEl.innerHTML = html;
}

function runFeedOrUser(username, includeOwn) {
setStatus('Scanning history and posts for @' + username + '...', false);
var cu = getConnectedUser(), obs = cu || username;
var ownP = includeOwn ? hiveCall('bridge.get_account_posts', { sort: 'posts', account: username, limit: 20, observer: obs }).catch(function () { return []; }) : Promise.resolve([]);
return Promise.all([ownP, getAccountHistory(username, includeOwn ? 6 : 24)]).then(function (res) {
var ownPosts = res[0] || [], hist = res[1];
return fetchSeedPosts(hist.seeds, hist.skipKeys).then(function (seedData) {
var toks = [], wMap = {};
seedData.forEach(function (e) { tokenize((e.post.title || '') + ' ' + (e.post.body || '')).forEach(function (t) { toks.push(t); wMap[t] = (wMap[t] || 0) + e.weight; }); });
ownPosts.forEach(function (p) { hist.skipKeys[p.author + '/' + p.permlink] = true; tokenize((p.title || '') + ' ' + (p.body || '')).forEach(function (t) { toks.push(t); wMap[t] = (wMap[t] || 0) + 2; }); });
var pVec = toks.length ? buildVector(toks, wMap) : null;
return fetchAllFrontendsPool(obs).then(function (cands) {
var taste = loadTaste(), scored = [], added = {};
ownPosts.forEach(function (p) {
var k = p.author + '/' + p.permlink;
if (!taste.disliked[k]) { added[k] = true; scored.push({ post: p, baseScore: 1.5, finalScore: 1.5, matched: ['Author Post'], tokens: tokenize((p.title || '') + ' ' + (p.body || '')), timestamp: Date.parse((p.created || '') + 'Z') || 0 }); }
});
cands.forEach(function (c) {
var k = c.author + '/' + c.permlink;
if (added[k] || hist.skipKeys[k] || taste.disliked[k] || (!includeOwn && c.author === username)) return;
var ct = tokenize((c.title || '') + ' ' + (c.body || ''));
if (ct.length < 20 && pVec) return;
var sim = pVec ? cosineSim(pVec, buildVector(ct, null)) : { score: 0.1, matched: [] };
if (sim.score > 0.005 || !pVec) scored.push({ post: c, baseScore: sim.score, finalScore: sim.score, matched: sim.matched, tokens: ct, timestamp: Date.parse((c.created || '') + 'Z') || 0 });
});
appState.results = scored;
rerankAndRender();
setStatus('Loaded ' + Math.min(100, appState.results.length) + ' results.', false);
if (cu) return syncUserVotesForDisplayedPosts(cu);
});
});
});
}
function runSearchOrNew(query, isNewUsers) {
var q = String(query || '').trim().toLowerCase(), cu = getConnectedUser();
setStatus('Searching Hive posts...', false);
return fetchAllFrontendsPool(cu).then(function (cands) {
var names = cands.map(function (c) { return c.author; });
var accP = isNewUsers ? hiveCall('condenser_api.get_accounts', [Array.from(new Set(names))]).catch(function () { return []; }) : Promise.resolve([]);
return accP.then(function (accs) {
var cMap = {}, cutoff = Date.now() - (365 * 86400000), taste = loadTaste(), scored = [];
if (Array.isArray(accs)) accs.forEach(function (a) { if (a && a.name) cMap[a.name] = Date.parse(a.created + 'Z') || 0; });
cands.forEach(function (c) {
var k = c.author + '/' + c.permlink;
if (taste.disliked[k]) return;
if (isNewUsers && (!cMap[c.author] || cMap[c.author] < cutoff)) return;
var txt = ((c.title || '') + ' ' + (c.body || '')).toLowerCase(), ct = tokenize(txt), score = isNewUsers ? 1.0 : 0;
if (q) {
if ((c.title || '').toLowerCase().indexOf(q) !== -1) score += 0.5;
else if (txt.indexOf(q) !== -1) score += 0.25;
else return;
}
if (score > 0) scored.push({ post: c, baseScore: score, finalScore: score, matched: q ? [q] : [], tokens: ct, timestamp: Date.parse((c.created || '') + 'Z') || 0 });
});
appState.results = scored;
rerankAndRender();
setStatus('Found ' + Math.min(100, appState.results.length) + ' matching posts.', false);
if (cu) return syncUserVotesForDisplayedPosts(cu);
});
});
}

function startApp() {
if (appState.isRunning) return;
var raw = document.getElementById('queryInput').value.trim(), btn = document.getElementById('runBtn');
closePostReader();
appState.isRunning = true; btn.disabled = true; btn.textContent = 'Scanning...';
document.getElementById('feed').innerHTML = '';
resolveQueryMode(raw).then(function (r) {
if (r.type === 'feed') return runFeedOrUser(r.value, false);
if (r.type === 'user') return runFeedOrUser(r.value, true);
return runSearchOrNew(r.value, r.type === 'newusers');
}).catch(function (e) { setStatus(e.message || 'Error occurred.', true); })
.then(function () { appState.isRunning = false; btn.disabled = false; btn.textContent = 'Discover'; });
}

function loginKeychain() {
if (!window.hive_keychain) { setStatus('Hive Keychain not detected.', true); return; }
window.hive_keychain.requestSignBuffer(null, 'Authenticate NectarSeeker', 'Posting', function (res) {
if (res && res.success && res.data && res.data.username) {
var u = stripLeadingAt(res.data.username);
appState.kcUser = u; appState.userVoteHistoryMap = {};
try { localStorage.setItem(KC_USER_KEY, u); } catch (e) {}
updateKeychainUI();
if (appState.results.length > 0) syncUserVotesForDisplayedPosts(u);
else { setMode('feed'); document.getElementById('queryInput').value = '@' + u; startApp(); }
} else setStatus('Keychain sign-in cancelled.', true);
});
}

function detectKeychain() {
updateKeychainUI();
if (window.hive_keychain) document.getElementById('kcRow').style.display = 'flex';
}

document.getElementById('queryInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') startApp(); });
updateTasteBanner(); detectKeychain(); setTimeout(detectKeychain, 700);
