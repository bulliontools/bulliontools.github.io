<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NectarSeeker | Hive Content Recommender</title>
  <style>
    :root {
      --hive-red: #e31337;
      --hive-red-hover: #ff264c;
      --hive-glow: rgba(227, 19, 55, 0.25);
      --bg-dark: #0d1017;
      --surface-1: #151a24;
      --surface-2: #1c2331;
      --border: #2a3447;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(0.75rem, 3vw, 1.5rem) clamp(0.5rem, 2vw, 1rem) 3rem clamp(0.5rem, 2vw, 1rem);
      background: radial-gradient(circle at top right, #1d121c 0%, var(--bg-dark) 48%);
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, var(--surface-1) 0%, #1d1522 100%);
      border: 1px solid var(--border);
      border-top: 3px solid var(--hive-red);
      border-radius: 14px;
      padding: clamp(1rem, 2.5vw, 1.35rem) clamp(1rem, 3vw, 1.5rem);
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .hive-hex {
      width: 34px;
      height: 34px;
      background: var(--hive-red);
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      color: #fff;
      box-shadow: 0 0 16px var(--hive-glow);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.5vw, 1.55rem);
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: clamp(0.85rem, 1.5vw, 0.92rem);
    }
    .panel {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(0.85rem, 2vw, 1.25rem);
      margin-bottom: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .segmented {
      display: inline-flex;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
      flex-wrap: wrap;
    }
    .seg-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0.42rem 0.8rem;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .seg-btn:hover { color: var(--text-main); }
    .seg-btn.active {
      background: var(--hive-red);
      color: #fff;
      box-shadow: 0 2px 8px var(--hive-glow);
    }
    .controls {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.78rem 1rem;
      font-size: 1rem;
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input::placeholder { color: #64748b; }
    input:focus {
      border-color: var(--hive-red);
      box-shadow: 0 0 0 3px var(--hive-glow);
    }
    .primary-btn {
      padding: 0.78rem 1.35rem;
      font-size: 0.98rem;
      background: linear-gradient(135deg, var(--hive-red) 0%, #b80d2b 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
      touch-action: manipulation;
      box-shadow: 0 4px 14px var(--hive-glow);
      transition: transform 0.1s ease, filter 0.15s ease;
      white-space: nowrap;
    }
    .primary-btn:hover { filter: brightness(1.1); }
    .primary-btn:active { transform: translateY(1px); }
    .primary-btn:disabled {
      background: #334155;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .kc-row {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.65rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .kc-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.48rem 0.9rem;
      border-radius: 7px;
      cursor: pointer;
    }
    .kc-btn:hover { background: #0f172a; }
    .taste-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.65rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.83rem;
      color: var(--text-muted);
    }
    .taste-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .taste-up {
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .taste-down {
      color: #fb7185;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .reset-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.28rem 0.6rem;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .reset-btn:hover {
      color: #fff;
      border-color: #fb7185;
    }
    #status {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #bae6fd;
      background: rgba(14, 116, 144, 0.2);
      padding: 0.75rem 1rem;
      border-radius: 9px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      word-break: break-word;
    }
    #status.error {
      color: #fecdd3;
      background: rgba(159, 18, 57, 0.28);
      border-color: rgba(251, 113, 133, 0.45);
    }
    .card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      padding: clamp(0.9rem, 2vw, 1.15rem) clamp(1rem, 2.5vw
